name: Deploy CivicPulse to Red Hat OpenShift

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: 'Skip Pytest & Frontend validation (Fast Deploy)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # ====================================================
  # 1. Automated Test Suite (Pytest & Frontend Build)
  # ====================================================
  test:
    name: Run Test Suite
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Initial Models & Seed DB
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python app/ml/train_models.py
          python app/initial_data.py

      - name: Run Backend Pytest
        run: |
          python -m pytest backend/tests -v -p no:cacheprovider

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Frontend Build
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

  # ====================================================
  # 2. Direct OpenShift Native Build & Deploy
  # ====================================================
  deploy-openshift:
    name: Deploy to OpenShift Cluster
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to OpenShift Cluster
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }}
          insecure_skip_tls_verify: true

      - name: Apply Core Configurations & Storage
        run: |
          oc apply -f openshift/configmap.yaml -n ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }}
          oc apply -f openshift/pvc.yaml -n ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }}
          oc apply -f openshift/buildconfig.yaml -n ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }}

      - name: Build Backend Image on OpenShift
        run: |
          oc start-build civicpulse-backend --from-dir=./backend --follow --wait -n ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }}

      - name: Build Frontend Image on OpenShift
        run: |
          oc start-build civicpulse-frontend --from-dir=./frontend --follow --wait -n ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }}

      - name: Apply Deployments, Services & Routes
        run: |
          oc apply -f openshift/backend-deployment.yaml -n ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }}
          oc apply -f openshift/frontend-deployment.yaml -n ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }}

      - name: Trigger Rollout & Wait for Health
        run: |
          oc rollout restart deployment/civicpulse-backend -n ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }} || true
          oc rollout restart deployment/civicpulse-frontend -n ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }} || true
          oc rollout status deployment/civicpulse-backend -n ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }} --timeout=180s || true
          oc rollout status deployment/civicpulse-frontend -n ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }} --timeout=180s || true

      - name: Output Live OpenShift Public Routes
        run: |
          echo "========================================="
          echo "🎉 CIVICPULSE DEPLOYMENT SUCCESSFUL!"
          echo "========================================="
          echo "Active OpenShift Routes (Public URLs):"
          oc get routes -n ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }}
          echo "========================================="
