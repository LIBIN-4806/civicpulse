name: Deploy CivicPulse to Red Hat OpenShift

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: 'Skip Pytest & Frontend validation (Fast Deploy)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ====================================================
  # 1. Automated Test Suite (Pytest & Frontend Build)
  # ====================================================
  test:
    name: Run Test Suite
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Initial Models & Seed DB
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python app/ml/train_models.py
          python app/initial_data.py

      - name: Run Backend Pytest
        run: |
          python -m pytest backend/tests -v -p no:cacheprovider

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Frontend Build
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

  # ====================================================
  # 2. Build & Push Docker Images to GHCR
  # ====================================================
  build-and-push:
    name: Build & Push Container Images
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.image_names.outputs.backend_image }}
      frontend_image: ${{ steps.image_names.outputs.frontend_image }}
      image_tag: ${{ steps.image_names.outputs.image_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Image Names & Tags
        id: image_names
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.sha }}"
          BACKEND_IMG="${{ env.REGISTRY }}/${REPO_OWNER}/civicpulse-backend"
          FRONTEND_IMG="${{ env.REGISTRY }}/${REPO_OWNER}/civicpulse-frontend"
          
          echo "backend_image=${BACKEND_IMG}" >> $GITHUB_OUTPUT
          echo "frontend_image=${FRONTEND_IMG}" >> $GITHUB_OUTPUT
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image_names.outputs.backend_image }}:${{ steps.image_names.outputs.image_tag }}
            ${{ steps.image_names.outputs.backend_image }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
          tags: |
            ${{ steps.image_names.outputs.frontend_image }}:${{ steps.image_names.outputs.image_tag }}
            ${{ steps.image_names.outputs.frontend_image }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ====================================================
  # 3. Deploy to Red Hat OpenShift Cluster
  # ====================================================
  deploy-openshift:
    name: Deploy to OpenShift Cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to OpenShift Cluster
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }}
          insecure_skip_tls_verify: true

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Container Image Tags in Manifests
        working-directory: openshift
        run: |
          kustomize edit set image ghcr.io/placeholder-owner/civicpulse-backend=${{ needs.build-and-push.outputs.backend_image }}:${{ needs.build-and-push.outputs.image_tag }}
          kustomize edit set image ghcr.io/placeholder-owner/civicpulse-frontend=${{ needs.build-and-push.outputs.frontend_image }}:${{ needs.build-and-push.outputs.image_tag }}

      - name: Apply OpenShift Manifests
        run: |
          oc apply -k openshift/ -n ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }}

      - name: Verify Backend Rollout
        run: |
          oc rollout status deployment/civicpulse-backend -n ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }} --timeout=180s

      - name: Verify Frontend Rollout
        run: |
          oc rollout status deployment/civicpulse-frontend -n ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }} --timeout=180s

      - name: Output Live OpenShift Routes
        run: |
          echo "========================================="
          echo "🎉 CIVICPULSE DEPLOYMENT SUCCESSFUL!"
          echo "========================================="
          echo "Active OpenShift Routes:"
          oc get routes -n ${{ secrets.OPENSHIFT_NAMESPACE || 'civicpulse' }}
          echo "========================================="
